name: fitcoach
description: "FitCoach - Personal Trainer & Member Task Tracking App"
publish_to: 'none'
version: 1.0.2+22

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.1
  firebase_crashlytics: ^4.3.0

  # State management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.1
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  app_links: ^6.4.0
  http: ^1.2.2
  onesignal_flutter: ^5.5.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
